# Full local stack: PostgreSQL, Redis, S3-compatible storage, Mailpit, LiveKit SFU + Egress, API and web.
name: meet-platform

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meet}
      POSTGRES_USER: ${POSTGRES_USER:-meet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  pg-backup:
    <<: *restart
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-meet}
      PGDATABASE: ${POSTGRES_DB:-meet}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${DATA_ROOT:-D:/Meeting/meeting-application-java/docker}/backups
        target: /backups
        bind: { create_host_path: true }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f="/backups/meet-$$(date +%Y%m%d-%H%M%S).dump"
          if pg_dump -Fc -f "$$f.part"; then mv "$$f.part" "$$f"; echo "backup written: $$f"; else rm -f "$$f.part"; echo "backup FAILED"; fi
          find /backups -name 'meet-*.dump' -mtime +14 -delete
          sleep 86400
        done
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  pgadmin:
    <<: *restart
    image: dpage/pgadmin4:9.18.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@domain.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: "80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  redis:
    <<: *restart
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes:
      - type: bind
        source: ${DATA_ROOT:-D:/Meeting/meeting-application-java/docker}/redis
        target: /data
        bind: { create_host_path: true }
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    <<: *restart
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - type: bind
        source: ${DATA_ROOT:-D:/Meeting/meeting-application-java/docker}/minio
        target: /data
        bind: { create_host_path: true }
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  livekit:
    <<: *restart
    image: livekit/livekit-server:v1.13.11
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        prometheus_port: 6789
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY:?set in .env}: ${LIVEKIT_API_SECRET:?set in .env}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://backend:8080/api/v1/webhooks/livekit
        room:
          empty_timeout: 300
          departure_timeout: 20
        audio:
          active_level: 35
          min_percentile: 40
          update_interval: 400
          smooth_intervals: 2
        logging:
          level: info
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "51000-51050:51000-51050/udp"

  egress:
    <<: *restart
    image: livekit/egress:v1.15.0
    depends_on:
      livekit:
        condition: service_started
      minio:
        condition: service_started
    cap_add:
      - SYS_ADMIN
    shm_size: 1gb
    deploy:
      resources:
        limits: { cpus: "4", memory: 4g }
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        health_port: 9090
        log_level: info
        s3:
          access_key: ${S3_ACCESS_KEY}
          secret: ${S3_SECRET_KEY}
          region: us-east-1
          endpoint: http://minio:9000
          bucket: ${S3_RECORDINGS_BUCKET:-meet-recordings}
          force_path_style: true

  backend:
    <<: *restart
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    environment:
      RECORDING_STORAGE_PATH: /data/recordings
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meet}
      DB_USERNAME: ${POSTGRES_USER:-meet}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set in .env}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_REQUIRE_EMAIL_VERIFICATION: ${APP_REQUIRE_EMAIL_VERIFICATION:-true}
      APP_OPENAPI_ENABLED: ${APP_OPENAPI_ENABLED:-true}
      APP_RECORDING_RETENTION_DAYS: ${APP_RECORDING_RETENTION_DAYS:-90}
      APP_MAIL_FROM: ${APP_MAIL_FROM}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_RECORDINGS_BUCKET: ${S3_RECORDINGS_BUCKET:-meet-recordings}
      APP_COORDINATION_STORE: redis
      APP_METRICS_SCRAPE_PASSWORD: ${APP_METRICS_SCRAPE_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      APP_CALENDAR_ENCRYPTION_KEY: ${APP_CALENDAR_ENCRYPTION_KEY:-}
      APP_CALENDAR_CALLBACK_BASE_URL: ${APP_CALENDAR_CALLBACK_BASE_URL:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      MICROSOFT_CALENDAR_CLIENT_ID: ${MICROSOFT_CALENDAR_CLIENT_ID:-}
      MICROSOFT_CALENDAR_CLIENT_SECRET: ${MICROSOFT_CALENDAR_CLIENT_SECRET:-}
      MICROSOFT_CALENDAR_TENANT: ${MICROSOFT_CALENDAR_TENANT:-common}
      # OpenTelemetry Endpoint fix (valid dummy URL + export disabled)
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://127.0.0.1:4318/v1/traces"
      MANAGEMENT_TRACING_ENABLED: "false"
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-D:/Meeting/meeting-application-java/docker}/Recordings
        target: /data/recordings
        bind: { create_host_path: true }
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    <<: *restart
    build: ./web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

  prometheus:
    <<: *restart
    profiles: ["observability"]
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    secrets:
      - metrics_scrape_password
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    <<: *restart
    profiles: ["observability"]
    image: grafana/grafana:13.2.5
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

  jaeger:
    <<: *restart
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"

secrets:
  metrics_scrape_password:
    environment: APP_METRICS_SCRAPE_PASSWORD

networks:
  default:
    name: meet-platform-net

volumes:
  pgdata:
  pgadmindata:
  prometheusdata:
  grafanadata:
  redisdata:
  miniodata: