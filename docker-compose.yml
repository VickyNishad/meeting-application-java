# Full stack: PostgreSQL, Redis, LiveKit SFU, API and web. Files are kept on local disk unless STORAGE_PROVIDER=s3.
# Mail goes through the SMTP server set in .env, in every environment.
#   cp .env.example .env                                  # then edit secrets
#   docker compose up -d --build
#   docker compose --profile observability up -d          # adds Prometheus, Grafana, Jaeger
#   docker compose --profile tls up -d                    # adds Caddy: HTTPS for web, API, LiveKit and S3 (needs a domain)
#   docker compose --profile minio up -d                  # adds MinIO, an S3-compatible server (STORAGE_PROVIDER=s3, S3_ENDPOINT=http://minio:9000)
#   docker compose --profile egress up -d                 # adds the recorder (needs 4 vCPU / 4 GB and APP_CLOUD_RECORDING_ENABLED=true)
# Step-by-step Windows guide and helper scripts: README-Docker.md, scripts/docker-*.bat
# Web app: http://localhost:3000
#
# DATA_ROOT (default ./docker, next to this file) holds MinIO, Redis, speaking clips and nightly database backups.
# STORAGE_LOCAL_BASE_PATH (default ./storage) holds shared files and recordings when STORAGE_PROVIDER=local.
# These folders are git-ignored. PostgreSQL, Prometheus and Grafana use named volumes.
name: meet-platform

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meet}
      POSTGRES_USER: ${POSTGRES_USER:-meet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  pg-backup:
    <<: *restart
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-meet}
      PGDATABASE: ${POSTGRES_DB:-meet}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${DATA_ROOT:-./docker}/backups
        target: /backups
        bind: { create_host_path: true }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f="/backups/meet-$$(date +%Y%m%d-%H%M%S).dump"
          if pg_dump -Fc -f "$$f.part"; then mv "$$f.part" "$$f"; echo "backup written: $$f"; else rm -f "$$f.part"; echo "backup FAILED"; fi
          find /backups -name 'meet-*.dump' -mtime +14 -delete
          sleep 86400
        done
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  pgadmin:
    <<: *restart
    image: dpage/pgadmin4:9.18.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@domain.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: "80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  redis:
    <<: *restart
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes:
      - type: bind
        source: ${DATA_ROOT:-./docker}/redis
        target: /data
        bind: { create_host_path: true }
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    <<: *restart
    # Optional: not needed with STORAGE_PROVIDER=local or with AWS S3.
    profiles: ["minio"]
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    volumes:
      - type: bind
        source: ${DATA_ROOT:-./docker}/minio
        target: /data
        bind: { create_host_path: true }
    ports:
      # Browsers fetch recordings and files from presigned S3 URLs. Loopback by default; with the "tls" profile
      # they go through Caddy instead. Set S3_BIND_ADDRESS=0.0.0.0 only to serve S3_PUBLIC_ENDPOINT directly.
      - "${S3_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "127.0.0.1:9001:9001"

  livekit:
    <<: *restart
    image: livekit/livekit-server:v1.13.11
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        prometheus_port: 6789
        rtc:
          tcp_port: 7881
          # Must match the UDP ports published below (both come from LIVEKIT_RTC_PORT_START/END).
          port_range_start: ${LIVEKIT_RTC_PORT_START:-50000}
          port_range_end: ${LIVEKIT_RTC_PORT_END:-50100}
          # The address clients send media to. 127.0.0.1 only works on this PC: on a server set LIVEKIT_NODE_IP
          # to its public IP (or LIVEKIT_USE_EXTERNAL_IP=true to discover it via STUN).
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-false}
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        # Embedded TURN relay for clients behind firewalls that block the media ports (UDP 3478).
        turn:
          enabled: ${LIVEKIT_TURN_ENABLED:-false}
          domain: ${LIVEKIT_TURN_DOMAIN:-localhost}
          udp_port: 3478
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY:?set in .env}: ${LIVEKIT_API_SECRET:?set in .env}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://backend:8080/api/v1/webhooks/livekit
        room:
          empty_timeout: 300
          departure_timeout: 20
        audio:
          active_level: 35
          min_percentile: 40
          update_interval: 400
          smooth_intervals: 2
        logging:
          level: info
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "${LIVEKIT_RTC_PORT_START:-50000}-${LIVEKIT_RTC_PORT_END:-50100}:${LIVEKIT_RTC_PORT_START:-50000}-${LIVEKIT_RTC_PORT_END:-50100}/udp"
      - "3478:3478/udp"

  egress:
    <<: *restart
    # Optional: whole-meeting recording. Needs APP_CLOUD_RECORDING_ENABLED=true. Too heavy for a small server: run it
    # on its own machine there.
    profiles: ["egress"]
    image: livekit/egress:v1.15.0
    depends_on:
      livekit:
        condition: service_started
      minio:
        condition: service_started
        required: false
    cap_add:
      - SYS_ADMIN
    shm_size: 1gb
    deploy:
      resources:
        limits: { cpus: "4", memory: 4g }
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        health_port: 9090
        log_level: info
        s3:
          # Empty keys on AWS: the IAM role of the machine.
          access_key: ${S3_ACCESS_KEY:-}
          secret: ${S3_SECRET_KEY:-}
          region: ${S3_REGION:-${AWS_REGION:-us-east-1}}
          endpoint: ${S3_ENDPOINT-http://minio:9000}
          bucket: ${S3_RECORDINGS_BUCKET:-${AWS_S3_BUCKET:-meet-recordings}}
          force_path_style: ${S3_FORCE_PATH_STYLE:-true}

  backend:
    <<: *restart
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
        required: false
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    environment:
      # prod forces Secure cookies, e-mail verification, S3 storage and disables Swagger (application-prod.yml).
      # For local Swagger set SPRING_PROFILES_ACTIVE= (empty) in .env.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-prod}
      # Where files are kept: local (default) or s3. See .env.example.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_BASE_PATH: /data/storage
      STORAGE_PRESIGN_TTL: ${STORAGE_PRESIGN_TTL:-PT15M}
      APP_CLOUD_RECORDING_ENABLED: ${APP_CLOUD_RECORDING_ENABLED:-false}
      APP_SPEECH_CLIP_RETENTION_DAYS: ${APP_SPEECH_CLIP_RETENTION_DAYS:-90}
      # Speaking clips. LOCAL: kept in /data/recordings (the host folder RECORDING_LOCAL_PATH, mounted below).
      # S3: that folder is staging only; finished clips go to AWS_S3_BUCKET (IAM role, or the AWS_* keys).
      RECORDING_STORAGE_PATH: /data/recordings
      RECORDING_STORAGE_TYPE: ${RECORDING_STORAGE_TYPE:-${STORAGE_PROVIDER:-}}
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PREFIX: ${AWS_S3_PREFIX:-speaking-clips}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meet}
      DB_USERNAME: ${POSTGRES_USER:-meet}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set in .env}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_REQUIRE_EMAIL_VERIFICATION: ${APP_REQUIRE_EMAIL_VERIFICATION:-true}
      APP_OPENAPI_ENABLED: ${APP_OPENAPI_ENABLED:-false}
      APP_RECORDING_RETENTION_DAYS: ${APP_RECORDING_RETENTION_DAYS:-90}
      APP_MAIL_FROM: ${APP_MAIL_FROM:?set APP_MAIL_FROM in .env}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Unset: MinIO. Set empty (S3_ENDPOINT=) for AWS S3.
      S3_ENDPOINT: ${S3_ENDPOINT-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-${AWS_REGION:-us-east-1}}
      S3_RECORDINGS_BUCKET: ${S3_RECORDINGS_BUCKET:-${AWS_S3_BUCKET:-meet-recordings}}
      S3_FILES_BUCKET: ${S3_FILES_BUCKET:-${AWS_S3_BUCKET:-meet-files}}
      APP_COORDINATION_STORE: redis
      APP_METRICS_SCRAPE_PASSWORD: ${APP_METRICS_SCRAPE_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      APP_CALENDAR_ENCRYPTION_KEY: ${APP_CALENDAR_ENCRYPTION_KEY:-}
      APP_CALENDAR_CALLBACK_BASE_URL: ${APP_CALENDAR_CALLBACK_BASE_URL:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      MICROSOFT_CALENDAR_CLIENT_ID: ${MICROSOFT_CALENDAR_CLIENT_ID:-}
      MICROSOFT_CALENDAR_CLIENT_SECRET: ${MICROSOFT_CALENDAR_CLIENT_SECRET:-}
      MICROSOFT_CALENDAR_TENANT: ${MICROSOFT_CALENDAR_TENANT:-common}
      # OpenTelemetry Endpoint fix (valid dummy URL + export disabled)
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://127.0.0.1:4318/v1/traces"
      MANAGEMENT_TRACING_ENABLED: "false"
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"
    volumes:
      - type: bind
        source: ${RECORDING_LOCAL_PATH:-${DATA_ROOT:-./docker}/Recordings}
        target: /data/recordings
        bind: { create_host_path: true }
      - type: bind
        source: ${STORAGE_LOCAL_BASE_PATH:-./storage}
        target: /data/storage
        bind: { create_host_path: true }
    ports:
      # Loopback only: browsers reach the API through the web container's nginx (or Caddy), never directly.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    <<: *restart
    build:
      context: ./web
      args:
        # Silence (ms) before an active speaker's green tile border is removed; empty = 600.
        VITE_SPEAKING_RELEASE_MS: ${VITE_SPEAKING_RELEASE_MS:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

  # HTTPS reverse proxy for production (see infra/caddy/Caddyfile for the matching .env values).
  caddy:
    <<: *restart
    profiles: ["tls"]
    image: caddy:2.10-alpine
    depends_on:
      web:
        condition: service_started
      livekit:
        condition: service_started
      minio:
        condition: service_started
        required: false
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      S3_DOMAIN: ${S3_DOMAIN:-s3.localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

  prometheus:
    <<: *restart
    profiles: ["observability"]
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    secrets:
      - metrics_scrape_password
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    <<: *restart
    profiles: ["observability"]
    image: grafana/grafana:13.2.5
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

  jaeger:
    <<: *restart
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"

secrets:
  metrics_scrape_password:
    environment: APP_METRICS_SCRAPE_PASSWORD

networks:
  default:
    name: meet-platform-net

volumes:
  pgdata:
  pgadmindata:
  prometheusdata:
  grafanadata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
