<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Meetly — video meetings and scheduling" />
    <title>Meetly</title>
    <script>
      (function () {
        var theme = null;
        try { theme = window.localStorage.getItem('mp-theme'); } catch (e) { theme = null; }
        var dark = theme === 'dark' || ((theme === null || theme === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
