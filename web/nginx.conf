# SPA + API reverse proxy. The backend is reachable as `backend:8080` on the compose network.
upstream backend_api {
    server backend:8080;
    keepalive 16;
}

# Behind the optional Caddy TLS proxy (compose profile "tls") keep the client's original scheme, so the API sees
# https; when nginx is the edge itself, use its own scheme and port.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $forwarded_proto $forwarded_port {
    https   443;
    default $server_port;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 30m;  # meeting file uploads are limited to 25 MB by the API

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Inherited by every proxied location below (none of them sets its own proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $forwarded_port;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # camera/mic/display-capture are needed by the meeting room.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Core REST APIs
    location /api/ {
        proxy_pass http://backend_api;
        proxy_read_timeout 60s;
    }

    # Swagger / OpenAPI (the API serves them only when APP_OPENAPI_ENABLED=true and the prod profile is off).
    location ~* ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend_api;
    }

    # Health probes only. Metrics (/actuator/prometheus) are scraped on the internal network, never through here.
    location ^~ /actuator/health {
        proxy_pass http://backend_api;
    }
    location ^~ /actuator/ {
        return 404;
    }

    # OAuth2 login endpoints served by the backend (authorization start + provider callback).
    location ^~ /oauth2/ {
        proxy_pass http://backend_api;
    }
    location ^~ /login/oauth2/ {
        proxy_pass http://backend_api;
    }

    # Hashed build assets: cache forever. (add_header here replaces the server-level headers, so repeat nosniff.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: every non-file route serves index.html (never cached).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        # No inline or third-party scripts. LiveKit's signalling URL and the S3 endpoint differ per deployment, so
        # connections and media are allowed to any http(s)/ws(s) origin; styles allow inline (component libraries).
        # 'wasm-unsafe-eval' lets the microphone noise filter (our own RNNoise WebAssembly) run; it allows no eval().
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' ws: wss: https: http:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
