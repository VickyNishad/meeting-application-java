<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{title}}</title>
  <style>
    @media only screen and (max-width: 600px) {
      .outer { padding: 16px 8px !important; }
      .inner { padding: 28px 24px !important; }
      .heading { font-size: 22px !important; line-height: 30px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f1f2f6;-webkit-text-size-adjust:100%;">
  <div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;color:#f1f2f6;font-size:1px;line-height:1px;">
    {{intro}}
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f1f2f6" style="background-color:#f1f2f6;">
    <tr>
      <td class="outer" align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
          <tr>
            <td align="center" style="padding:0 0 24px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="36" height="36" align="center" valign="middle" bgcolor="#4f46e5" style="width:36px;height:36px;background-color:#4f46e5;border-radius:9px;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:19px;font-weight:700;line-height:36px;">M</td>
                  <td style="padding-left:10px;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:21px;font-weight:700;letter-spacing:-0.2px;">Meetly</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="inner" bgcolor="#ffffff" style="padding:40px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <h1 class="heading" style="margin:0 0 16px;color:#111827;font-size:24px;font-weight:700;line-height:32px;">{{title}}</h1>
              <p style="margin:0 0 12px;color:#374151;font-size:16px;line-height:24px;">Hi {{name}},</p>
              <p style="margin:0 0 28px;color:#374151;font-size:16px;line-height:24px;">{{intro}}</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#4f46e5" style="background-color:#4f46e5;border-radius:9px;">
                    <a href="{{link}}" target="_blank" style="display:inline-block;padding:14px 28px;color:#ffffff;font-size:16px;font-weight:600;line-height:20px;text-decoration:none;border-radius:9px;">{{button}}</a>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;color:#6b7280;font-size:14px;line-height:21px;">This link expires in {{expiry}} and can only be used once.</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="padding:24px 0;"><div style="height:1px;line-height:1px;font-size:1px;background-color:#e5e7eb;">&nbsp;</div></td></tr>
              </table>
              <p style="margin:0 0 6px;color:#6b7280;font-size:13px;line-height:20px;">Button not working? Copy this link into your browser:</p>
              <p style="margin:0;font-size:13px;line-height:20px;word-break:break-all;"><a href="{{link}}" target="_blank" style="color:#4f46e5;text-decoration:underline;">{{link}}</a></p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 16px 0;color:#6b7280;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;">
              {{ignore}}<br>
              Meetly &middot; Video meetings and scheduling
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
