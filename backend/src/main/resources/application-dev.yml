# Local development on a developer PC. Activate with SPRING_PROFILES_ACTIVE=dev (start-local.ps1 does this).
# Recordings and shared files are kept on this PC's disk instead of S3/MinIO:
#   D:/meetly/meet-recordings/...   D:/meetly/meet-files/...
# Note: cloud recordings are written by the LiveKit egress worker; in dev it must write into the same folder.
app:
  # Speaking clips on this PC (Recordings/DD-MM-YYYY/Meeting/Participant/...).
  speech-recordings:
    storage-path: ${RECORDING_STORAGE_PATH:D:/meetly/Recordings}
  security:
    cookie-secure: ${APP_COOKIE_SECURE:false}
  storage:
    type: local
    local-root: ${APP_STORAGE_LOCAL_ROOT:D:/meetly}
    # Not used by local storage; placeholders so S3 credentials are not required to start in dev.
    access-key: ${S3_ACCESS_KEY:unused-in-dev}
    secret-key: ${S3_SECRET_KEY:unused-in-dev}
  # Single API instance without Redis: room signal numbers and job locks are kept in memory.
  coordination:
    store: ${APP_COORDINATION_STORE:memory}

springdoc:
  api-docs:
    enabled: ${APP_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${APP_OPENAPI_ENABLED:true}

logging:
  level:
    com.example.meetplatform: DEBUG
