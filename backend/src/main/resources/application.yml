spring:
  application:
    name: meet-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meet}
    username: ${DB_USERNAME:meet}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    datatype:
      enum:
        # Enums only by name: {"microphone": 1} is invalid, not silently the second constant.
        fail-on-numbers-for-enums: true
  web:
    error:
      include-message: never
      include-stacktrace: never

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 200
    connection-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: meet-platform
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    enabled: ${APP_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${APP_OPENAPI_ENABLED:false}
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
    display-request-duration: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${APP_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    cookie-secure: ${APP_COOKIE_SECURE:true}
    issuer: ${APP_JWT_ISSUER:meet-platform}
    metrics-scrape-password: ${APP_METRICS_SCRAPE_PASSWORD:}
  auth:
    require-email-verification: ${APP_REQUIRE_EMAIL_VERIFICATION:true}
    email-verification-ttl: 48h
    password-reset-ttl: 1h
    max-failed-logins: 10
    lockout-duration: 15m
  livekit:
    public-url: ${LIVEKIT_PUBLIC_URL:ws://localhost:7880}
    api-url: ${LIVEKIT_API_URL:http://localhost:7880}
    api-key: ${LIVEKIT_API_KEY}
    api-secret: ${LIVEKIT_API_SECRET}
    token-ttl: 10m
    empty-room-timeout-seconds: 300
    request-timeout: 10s
  storage:
    # Empty = AWS S3 in the region below. Set only for an S3-compatible server (tests, MinIO).
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    # Empty on AWS. Only for an S3-compatible server: the address browsers reach it at.
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    # Empty on AWS: the IAM role of the server. Needed for an S3-compatible server such as MinIO.
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:${AWS_REGION:us-east-1}}
    recordings-bucket: ${S3_RECORDINGS_BUCKET:${AWS_S3_BUCKET:meet-recordings}}
    files-bucket: ${S3_FILES_BUCKET:${AWS_S3_BUCKET:meet-files}}
    presign-ttl: ${STORAGE_PRESIGN_TTL:PT15M}
    # local or s3. Anything else stops the application at startup.
    type: ${STORAGE_PROVIDER:${APP_STORAGE_TYPE:s3}}
    local-root: ${STORAGE_LOCAL_BASE_PATH:${APP_STORAGE_LOCAL_ROOT:}}
  recording:
    default-retention-days: ${APP_RECORDING_RETENTION_DAYS:90}
    file-prefix: recordings
    # Whole-meeting recording (LiveKit Egress). Off by default: turn on only where a recorder is deployed.
    cloud-enabled: ${APP_CLOUD_RECORDING_ENABLED:false}
  speech-recordings:
    # LOCAL: clips are kept in storage-path. S3: storage-path is a staging folder; finished clips go to the private
    # bucket below, same DD-MM-YYYY/<Meeting>/<Participant>/<file> layout (see SpeechClipObjectStore).
    # Follows STORAGE_PROVIDER unless RECORDING_STORAGE_TYPE is set. Empty = S3 with the prod profile, LOCAL otherwise.
    storage-type: ${RECORDING_STORAGE_TYPE:${STORAGE_PROVIDER:}}
    storage-path: ${RECORDING_LOCAL_PATH:${RECORDING_STORAGE_PATH:./data/Recordings}}
    s3:
      region: ${AWS_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      # One bucket holds everything: clips under this prefix, files/ and recordings/ next to it. The 90-day lifecycle
      # rule targets this prefix only, so it must not be empty when the bucket is shared.
      prefix: ${AWS_S3_PREFIX:speaking-clips}
      # Empty = AWS (https://s3.<region>.amazonaws.com). Only set for an S3-compatible server (tests, MinIO).
      endpoint: ${AWS_S3_ENDPOINT:}
      # Empty = the server's IAM role (instance profile / task role / web identity). Prefer the role in production.
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    min-free-bytes: ${RECORDING_MIN_FREE_BYTES:209715200}
    max-chunk-bytes: 8388608
    max-clip-bytes: 524288000
    access-url-ttl: ${STORAGE_PRESIGN_TTL:PT10M}
    # With S3 storage: clips older than this are removed and marked deleted, in step with the S3 lifecycle rule on the
    # clip prefix. 0 = never. Local clips are never removed automatically.
    retention-days: ${APP_SPEECH_CLIP_RETENTION_DAYS:90}
    retention-cron: "0 45 3 * * *"
    # Longest one run may take, below its 30-minute job lock. During an outage every clip waits for a timeout.
    retention-run-limit: PT20M
    stale-after: PT2M
    recovery-interval: PT1M
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
  coordination:
    store: ${APP_COORDINATION_STORE:redis}
  notifications:
    dispatch-enabled: ${APP_NOTIFICATIONS_DISPATCH_ENABLED:true}
    from-address: ${APP_MAIL_FROM:no-reply@meet.local}
    max-attempts: 5
    reminder-offsets: 24h,1h
  files:
    max-size-bytes: 26214400
    allowed-content-types: >-
      application/pdf,image/png,image/jpeg,image/gif,image/webp,text/plain,text/csv,
      application/vnd.openxmlformats-officedocument.wordprocessingml.document,
      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
      application/vnd.openxmlformats-officedocument.presentationml.presentation,
      application/zip
  calendar:
    encryption-key: ${APP_CALENDAR_ENCRYPTION_KEY:}
    callback-base-url: ${APP_CALENDAR_CALLBACK_BASE_URL:}
    google:
      client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
      client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    microsoft:
      client-id: ${MICROSOFT_CALENDAR_CLIENT_ID:}
      client-secret: ${MICROSOFT_CALENDAR_CLIENT_SECRET:}
      tenant: ${MICROSOFT_CALENDAR_TENANT:common}
  meetings:
    default-max-participants: 100
    hard-max-participants: 300
    host-dropout-grace: ${APP_HOST_DROPOUT_GRACE:PT20S}
    presence-debounce: ${APP_PRESENCE_DEBOUNCE:PT0.25S}
    reconnect-window: ${APP_RECONNECT_WINDOW:PT30S}