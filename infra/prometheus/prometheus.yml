global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: meet-api
    metrics_path: /actuator/prometheus
    # The API only serves metrics to this credential (APP_METRICS_SCRAPE_PASSWORD, mounted as a compose secret).
    basic_auth:
      username: prometheus
      password_file: /run/secrets/metrics_scrape_password
    static_configs:
      - targets: ["backend:8080"]

  - job_name: livekit
    static_configs:
      - targets: ["livekit:6789"]
