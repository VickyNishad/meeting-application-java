groups:
  - name: meet-api
    rules:
      - alert: ApiDown
        expr: up{job="meet-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "API instance {{ $labels.instance }} is down"

      - alert: ApiHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="meet-api",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count{job="meet-api"}[5m])), 1) > 0.02
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "More than 2% of API requests fail with 5xx"

      - alert: ApiJoinLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="meet-api",uri="/api/v1/meetings/{meetingId}/join"}[5m]))) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p95 meeting join latency above 500 ms"

      - alert: DbPoolSaturated
        expr: hikaricp_connections_pending{job="meet-api"} > 5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Requests are waiting for database connections"

      - alert: EmailDeliveryFailing
        expr: increase(meet_notifications_email_total{result="failed_attempt"}[15m]) > 10
        labels: {severity: warning}
        annotations:
          summary: "E-mail delivery attempts are failing"

  - name: livekit
    rules:
      - alert: LiveKitDown
        expr: up{job="livekit"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "LiveKit SFU {{ $labels.instance }} is down"
